name: OrthoFlow Auto Curator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "V3 全库分阶段：Patient → Rehab → Procedure；也可单独测试"
        required: true
        type: choice
        default: content_scan
        options:
          - content_scan
          - patient_scan
          - rehab_scan
          - procedure_scan
          - pfna_test
      save_draft:
        description: "是否把结果保存到 Supabase 待审核队列"
        required: true
        type: boolean
        default: false
  # V3 先继续手动测试。确认患者端/康复/Procedure 三类质量后再打开定时任务。
  # schedule:
  #   - cron: "37 3 * * *"
  #     timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: orthoflow-auto-curator
  cancel-in-progress: false

jobs:
  curator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AUTOCURATOR_MODEL: deepseek-v4-flash
      AUTOCURATOR_MAX_TASKS: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests jsonschema

      - name: Static self-test
        run: python scripts/ortho_auto_curator.py --self-test

      - name: Scheduled content scan — generate one batch
        if: github.event_name == 'schedule'
        run: python scripts/ortho_auto_curator.py --mode content_scan --save-draft

      - name: Manual test/run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          args=(--mode "${{ inputs.mode }}")
          if [[ "${{ inputs.save_draft }}" == "true" ]]; then
            args+=(--save-draft)
          fi
          python scripts/ortho_auto_curator.py "${args[@]}"

      - name: Upload generated JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-curator-v3-output-${{ github.run_number }}
          path: autocurator_output/
          if-no-files-found: ignore
          retention-days: 14
