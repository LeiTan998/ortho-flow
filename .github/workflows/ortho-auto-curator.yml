name: OrthoFlow Auto Curator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Patient V3.2.2 / Disease Rehab V3.1：生成、清理与 Round 2 定点修订"
        required: true
        type: choice
        default: patient_scan
        options:
          - patient_scan
          - patient_full
          - content_scan
          - rehab_scan
          - rehab_test
          - rehab_cleanup
          - rehab_final_fix
          - procedure_scan
          - pfna_test
      save_draft:
        description: "是否把结果保存到 Supabase 待审核队列；patient_full / rehab_cleanup / rehab_final_fix 必须勾选"
        required: true
        type: boolean
        default: true
  # 仍保持手动。Patient/Rehab/Procedure 全部稳定并建立审核发布机制后再考虑定时任务。
  # schedule:
  #   - cron: "37 3 * * *"
  #     timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: orthoflow-auto-curator
  cancel-in-progress: false

jobs:
  curator:
    runs-on: ubuntu-latest
    # GitHub-hosted job 上限内留出余量；全库顺序跑时最长约 5.5 小时。
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AUTOCURATOR_MODEL: deepseek-v4-flash
      AUTOCURATOR_MAX_TASKS: "5"
      AUTOCURATOR_FULL_MAX_TASKS: "9999"
      DEEPSEEK_REQUEST_TIMEOUT: "180"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests jsonschema

      - name: Static self-test
        run: python -u scripts/ortho_auto_curator.py --self-test

      - name: Scheduled content scan
        if: github.event_name == 'schedule'
        run: python -u scripts/ortho_auto_curator.py --mode content_scan --save-draft

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          args=(--mode "${{ inputs.mode }}")
          if [[ "${{ inputs.save_draft }}" == "true" ]]; then
            args+=(--save-draft)
          fi
          python -u scripts/ortho_auto_curator.py "${args[@]}"

      - name: Upload generated JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-curator-v3-output-${{ github.run_number }}
          path: autocurator_output/
          if-no-files-found: ignore
          retention-days: 14
